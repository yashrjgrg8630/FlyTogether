name: Daily Automated Maintenance Pulse

on:
  schedule:
    # Runs daily at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Test Suite
        id: test_run
        run: |
          cd backend
          python -m pytest tests/ -v
        continue-on-error: true

      - name: Update Daily Pulse Record
        run: |
          DATE_UTC=$(date -u +"%Y-%m-%d %H:%M:%S")
          STATUS="${{ steps.test_run.outcome == 'success' && 'Healthy' || 'Warning' }}"
          echo "| $DATE_UTC | $STATUS | 17 Backend Tests | Daily automated test pulse & maintenance |" >> .github/daily-pulse.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/daily-pulse.md
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(pulse): automated daily health check & activity record [skip ci]"
            git push origin main
          fi
